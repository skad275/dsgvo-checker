<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSGVO Tool-Checker (Browser-Version)</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
      --green: #16a34a;
      --yellow: #ca8a04;
      --red: #dc2626;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }

    .card {
      background-color: var(--card);
      max-width: 650px;
      width: 100%;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      border: 1px solid #e2e8f0;
    }

    .api-box {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
      box-sizing: border-box;
      font-family: inherit;
    }

    button {
      background-color: var(--primary);
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
      margin-top: 12px;
    }

    button:hover { background-color: #1d4ed8; }

    .result-box {
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
      text-align: center;
    }

    .GREEN { background: #f0fdf4; color: #14532d; border: 2px solid var(--green); }
    .YELLOW { background: #fefce8; color: #713f12; border: 2px solid var(--yellow); }
    .RED { background: #fef2f2; color: #7f1d1d; border: 2px solid var(--red); }

    .badge {
      display: inline-block;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>🛡️ DSGVO Tool-Checker für Schulen</h2>
  <p style="font-size: 0.9rem; color: #64748b; margin-bottom: 16px;">Analysiere Datenschutzerklärungen von KI-Tools direkt im Browser.</p>

  <!-- API Schlüssel -->
  <div class="api-box">
    <label style="font-size: 0.85rem; font-weight: 600;">Gemini API-Schlüssel:</label>
    <input type="password" id="api-key" placeholder="AIzaSy..." onchange="saveKey()">
    <span style="font-size: 0.75rem; color: #64748b;">Wird nur lokal in deinem Browser gespeichert.</span>
  </div>

  <!-- Text-Eingabe -->
  <div>
    <label style="font-weight: 600;">Datenschutzerklärung / AGB (Text hier reinkopieren):</label>
    <textarea id="policy-text" rows="6" placeholder="Kopiere den Text der Datenschutzerklärung der KI-Anwendung hier hinein..."></textarea>
    <button onclick="analyzeText()" id="btn-analyze">🔍 KI-Analyse starten</button>
  </div>

  <div id="loading" style="display:none; text-align:center; margin-top:15px; color:var(--primary); font-weight:600;">
    ⏳ Analysiere Text mit Gemini...
  </div>

  <!-- Ergebnisanzeige -->
  <div id="result" style="display: none;" class="result-box">
    <div id="result-badge" class="badge"></div>
    <h3 id="result-title"></h3>
    <p id="result-summary" style="text-align: left; margin-top: 12px; line-height: 1.5;"></p>
    <div style="text-align: left; margin-top: 12px;">
      <b>Gefundene Nachweise im Text:</b>
      <ul id="result-evidence" style="font-size: 0.85rem; padding-left: 20px; margin-top: 6px;"></ul>
    </div>
  </div>
</div>

<script>
  // API Key lokal speichern/laden
  document.getElementById("api-key").value = localStorage.getItem("gemini_key") || "";

  function saveKey() {
    localStorage.setItem("gemini_key", document.getElementById("api-key").value);
  }

  async function analyzeText() {
    const apiKey = document.getElementById("api-key").value.trim();
    const text = document.getElementById("policy-text").value.trim();

    if (!apiKey) return alert("Bitte gib deinen Gemini API-Schlüssel ein.");
    if (!text) return alert("Bitte füge den Text der Datenschutzerklärung ein.");

    document.getElementById("loading").style.display = "block";
    document.getElementById("result").style.display = "none";

    const prompt = `
    Analysiere diesen Text einer Datenschutzerklärung für den Einsatz an Schulen (DSGVO):
    ---
    ${text}
    ---

    Gib die Antwort streng im folgenden JSON-Format zurück:
    {
      "status": "GREEN" oder "YELLOW" oder "RED",
      "title": "Kurzer Titel der Bewertung",
      "summary": "Verständliche Zusammenfassung für Lehrpersonen (2-3 Sätze).",
      "evidence": ["Zitat 1 aus dem Text", "Zitat 2 aus dem Text"]
    }
    
    Kriterien:
    - RED: Datentransfer in unsichere Drittländer ohne DPF, KI-Training mit Nutzereingaben aktiv oder kein AVV bei Schüler-Accounts.
    - YELLOW: Nutzung bedingt möglich (z.B. nur durch Lehrperson, Opt-Out für KI-Training nötig).
    - GREEN: Hosting in der EU, kein KI-Training, AVV verfügbar.
    `;

    try {
      // Direkter API-Aufruf an Google Gemini aus dem Browser
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { response_mime_type: "application/json" }
        })
      });

      if (!response.ok) throw new Error("API-Aufruf fehlgeschlagen. Überprüfe den API-Schlüssel.");

      const rawData = await response.json();
      const resultJson = JSON.parse(rawData.candidates[0].content.parts[0].text);

      // Ergebnis im UI anzeigen
      const resDiv = document.getElementById("result");
      resDiv.className = `result-box ${resultJson.status}`;
      resDiv.style.display = "block";

      document.getElementById("result-badge").innerText = resultJson.status;
      document.getElementById("result-title").innerText = resultJson.title;
      document.getElementById("result-summary").innerText = resultJson.summary;

      const list = document.getElementById("result-evidence");
      list.innerHTML = "";
      resultJson.evidence.forEach(item => {
        const li = document.createElement("li");
        li.innerText = item;
        list.appendChild(li);
      });

    } catch (err) {
      alert("Fehler: " + err.message);
    } finally {
      document.getElementById("loading").style.display = "none";
    }
  }
</script>
</body>
</html>
